<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة تحليل البيانات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <h1>لوحة تحليل البيانات</h1>
        <p class="subtitle">ارفع ملف Excel فيتحدث التحليل والرسوم فورًا</p>
      </div>
      <label class="upload-btn">
        رفع ملف Excel
        <input id="fileInput" type="file" accept=".xlsx,.xls,.csv" hidden />
      </label>
    </header>

    <section id="emptyState" class="empty">
      <div class="dropzone" id="dropzone">
        <strong>اسحب الملف هنا أو اضغط لرفعه</strong>
        <span>يدعم xlsx / xls / csv — يتم اكتشاف الأعمدة تلقائيًا</span>
      </div>
    </section>

    <main id="dashboard" class="dashboard hidden">
      <div class="meta">
        <span id="fileName">—</span>
        <span id="rowCount">0 صف</span>
        <span id="colCount">0 عمود</span>
        <label class="sheet-pick">
          الورقة
          <select id="sheetSelect"></select>
        </label>
        <label class="sheet-pick">
          صف العناوين
          <select id="headerRowSelect"></select>
        </label>
      </div>

      <section class="kpis" id="kpis"></section>

      <section class="filters">
        <label>
          عمود التصنيف
          <select id="catCol"></select>
        </label>
        <label>
          عمود القيمة
          <select id="valCol"></select>
        </label>
        <label>
          عمود التاريخ (اختياري)
          <select id="dateCol"></select>
        </label>
        <label>
          بحث
          <input id="search" type="search" placeholder="ابحث في الجدول..." />
        </label>
      </section>

      <section class="charts">
        <article class="card chart-card">
          <h2>توزيع حسب التصنيف</h2>
          <div class="chart-box"><canvas id="barChart"></canvas></div>
        </article>
        <article class="card chart-card">
          <h2>الحصة النسبية</h2>
          <div class="chart-box pie"><canvas id="pieChart"></canvas></div>
        </article>
        <article class="card chart-card wide">
          <h2>الاتجاه الزمني</h2>
          <div class="chart-box line"><canvas id="lineChart"></canvas></div>
        </article>
      </section>

      <section class="card">
        <div class="data-head">
          <h2>البيانات</h2>
          <label class="inline-check">
            <input type="checkbox" id="onlySelectedCols" checked />
            أعمدة التحليل فقط
          </label>
          <label class="inline-check">
            <input type="checkbox" id="onlyInvalid" />
            الصفوف غير الصالحة فقط
          </label>
        </div>
        <div class="rules-box">
          <strong>قواعد التحقق</strong>
          <div class="rules-row">
            <label>العمود
              <select id="ruleCol"></select>
            </label>
            <label>النوع
              <select id="ruleType">
                <option value="auto">تلقائي</option>
                <option value="none">بدون</option>
                <option value="required">مطلوب</option>
                <option value="number">رقم</option>
                <option value="integer">عدد صحيح</option>
                <option value="date">تاريخ</option>
                <option value="unique">قيمة فريدة</option>
                <option value="list">قائمة قيم</option>
              </select>
            </label>
            <label>الحد الأدنى
              <input id="ruleMin" type="text" placeholder="اختياري" />
            </label>
            <label>الحد الأقصى
              <input id="ruleMax" type="text" placeholder="اختياري" />
            </label>
            <label>القائمة (مفصولة بفاصلة)
              <input id="ruleList" type="text" placeholder="مثال: نقدي،آجل" />
            </label>
            <button type="button" id="applyRule" class="upload-btn">تطبيق القاعدة</button>
            <button type="button" id="clearRules" class="ghost-btn">مسح القواعد</button>
          </div>
          <div id="rulesList" class="rules-list"></div>
        </div>
        <div class="validation-bar" id="validationBar"></div>
        <div class="table-wrap">
          <table id="dataTable"></table>
        </div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
